    <rect x="393" y="229" width="5" height="27" rx="2.5"/>
    <rect x="406" y="234" width="5" height="22" rx="2.5"/>
    <rect x="419" y="221" width="5" height="35" rx="2.5"/>
    <rect x="432" y="232" width="5" height="24" rx="2.5"/>
    <rect x="445" y="226" width="5" height="30" rx="2.5"/>
